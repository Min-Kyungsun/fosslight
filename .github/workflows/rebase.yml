name: Rebase feature branches on develop update

on:
  push:
    branches:
      - develop

jobs:
  rebase-feature-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 모든 브랜치와 히스토리를 가져와야 rebase 가능

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Rebase all feature branches onto develop
        run: |
          for branch in $(git branch -r | grep 'origin/feature/' | sed 's|origin/||'); do
            echo "Rebasing $branch onto develop..."
            git checkout $branch
            git rebase origin/develop || {
              echo "Rebase failed on $branch, aborting and skipping..."
              git rebase --abort
              continue
            }
            git push --force-with-lease origin $branch
          done
