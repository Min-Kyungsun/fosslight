name: Rebase feature branches on develop update

on:
  push:
    branches:
      - develop

jobs:
  rebase-feature-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Rebase all feature branches onto develop
        run: |
          conflict_found=false

          for branch in $(git branch -r | grep 'origin/feature/' | sed 's|origin/||'); do
            echo "🔄 Rebasing $branch onto develop..."
            git checkout $branch
            if ! git rebase origin/develop; then
              echo "❌ Rebase conflict detected in $branch"
              echo "🔍 Conflicted files:"
              git diff --name-only --diff-filter=U
              git rebase --abort
              conflict_found=true
              # conflict 발생 시 루프는 계속 돌지만, 전체 워크플로는 실패로 표시됨
            else
              git push --force-with-lease origin $branch
            fi
          done

          if [ "$conflict_found" = true ]; then
            echo "❌ One or more branches failed to rebase. Marking workflow as failed."
            exit 1  # ❗ 전체 워크플로 실패로 표시
          else
            echo "✅ All feature branches successfully rebased onto develop."
          fi
